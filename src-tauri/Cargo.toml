[package]
name = "loop-lab"
version = "1.0.0"
description = "Loop Lab desktop app"
edition = "2021"
publish = false

[lib]
name = "loop_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
